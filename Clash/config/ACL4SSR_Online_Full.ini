[custom]

mixed-port=7890
ipv6=true
allow-lan=false
unified-delay=false
log-level=warning
mode=rule
disable-keep-alive=false
keep-alive-idle=10
keep-alive-interval=15
tcp-concurrent=true
geo-auto-update=true
geo-update-interval=168
external-controller=127.0.0.1:9090
external-controller-cors-allow-origins=*
external-controller-cors-allow-private-network=true
external-ui=ui
external-ui-url=https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
profile-store-selected=true
profile-store-fake-ip=true
dns-enable=true
dns-respect-rules=true
dns-use-system-hosts=false
dns-listen=127.0.0.1:1053
dns-ipv6=false
dns-hosts[rule-set:malware]=rcode://refused
dns-hosts[rule-set:category-ads-all]=rcode://refused
dns-nameserver=https://8.8.8.8/dns-query#✅ Selector
dns-proxy-server-nameserver=8.8.8.8#DIRECT
dns-direct-nameserver=8.8.8.8#DIRECT
dns-direct-nameserver-follow-policy=true
dns-nameserver-policy[rule-set:ir]=8.8.8.8#DIRECT
dns-enhanced-mode=redir-host
tun-enable=true
tun-stack=mixed
tun-auto-route=true
tun-strict-route=true
tun-auto-detect-interface=true
tun-dns-hijack=any:53,tcp://any:53
tun-mtu=9000
sniffer-enable=true
sniffer-force-dns-mapping=true
sniffer-parse-pure-ip=true
sniffer-override-destination=true
sniffer-http-ports=80,8080,8880,2052,2082,2086,2095
sniffer-tls-ports=443,8443,2053,2083,2087,2096

ruleset=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware.txt


ruleset=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware-ip.txt

ruleset=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/category-ads-all.txt


ruleset=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt
 
ruleset=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ircidr.txt

custom_proxy_group=✅ Selector`select`[]♻️ Auto`.*`DIRECT
custom_proxy_group=♻️ Auto`url-test`.*`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true

