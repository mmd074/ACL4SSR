[custom]

; ─── بخش تنظیمات اصلی ───
mixed-port=7890
ipv6=true
allow-lan=false
unified-delay=false
log-level=warning
mode=rule
disable-keep-alive=false
keep-alive-idle=10
keep-alive-interval=15
tcp-concurrent=true
geo-auto-update=true
geo-update-interval=168
external-controller=127.0.0.1:9090
external-controller-cors-allow-origins=*
external-controller-cors-allow-private-network=true
external-ui=ui
external-ui-url=https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip

; ─── تنظیمات پروفایل ───
profile-store-selected=true
profile-store-fake-ip=true

; ─── تنظیمات DNS ───
dns-enable=true
dns-respect-rules=true
dns-use-system-hosts=false
dns-listen=127.0.0.1:1053
dns-ipv6=false
dns-hosts[rule-set:malware]=rcode://refused
dns-hosts[rule-set:category-ads-all]=rcode://refused
dns-nameserver=https://8.8.8.8/dns-query#✅ Selector
dns-proxy-server-nameserver=8.8.8.8#DIRECT
dns-direct-nameserver=8.8.8.8#DIRECT
dns-direct-nameserver-follow-policy=true
dns-nameserver-policy[rule-set:ir]=8.8.8.8#DIRECT
dns-enhanced-mode=redir-host

; ─── تنظیمات TUN ───
tun-enable=true
tun-stack=mixed
tun-auto-route=true
tun-strict-route=true
tun-auto-detect-interface=true
tun-dns-hijack=any:53,tcp://any:53
tun-mtu=9000

; ─── تنظیمات Sniffer ───
sniffer-enable=true
sniffer-force-dns-mapping=true
sniffer-parse-pure-ip=true
sniffer-override-destination=true
sniffer-http-ports=80,8080,8880,2052,2082,2086,2095
sniffer-tls-ports=443,8443,2053,2083,2087,2096

; ─── Rule Providers ───
rule-providers=malware,malware-cidr,category-ads-all,ir,ir-cidr

rule-providers-malware-type=http
rule-providers-malware-format=text
rule-providers-malware-behavior=domain
rule-providers-malware-path=./ruleset/malware.txt
rule-providers-malware-interval=86400
rule-providers-malware-url=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware.txt

rule-providers-malware-cidr-type=http
rule-providers-malware-cidr-format=text
rule-providers-malware-cidr-behavior=ipcidr
rule-providers-malware-cidr-path=./ruleset/malware-cidr.txt
rule-providers-malware-cidr-interval=86400
rule-providers-malware-cidr-url=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware-ip.txt

rule-providers-category-ads-all-type=http
rule-providers-category-ads-all-format=text
rule-providers-category-ads-all-behavior=domain
rule-providers-category-ads-all-path=./ruleset/category-ads-all.txt
rule-providers-category-ads-all-interval=86400
rule-providers-category-ads-all-url=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/category-ads-all.txt

rule-providers-ir-type=http
rule-providers-ir-format=text
rule-providers-ir-behavior=domain
rule-providers-ir-path=./ruleset/ir.txt
rule-providers-ir-interval=86400
rule-providers-ir-url=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt

rule-providers-ir-cidr-type=http
rule-providers-ir-cidr-format=text
rule-providers-ir-cidr-behavior=ipcidr
rule-providers-ir-cidr-path=./ruleset/ir-cidr.txt
rule-providers-ir-cidr-interval=86400
rule-providers-ir-cidr-url=https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ircidr.txt

; ─── بخش Rules ───
rules=GEOIP,lan,DIRECT,no-resolve
rules=NETWORK,udp,REJECT
rules=RULE-SET,malware,REJECT
rules=RULE-SET,category-ads-all,REJECT
rules=RULE-SET,malware-cidr,REJECT
rules=RULE-SET,ir,DIRECT
rules=RULE-SET,ir-cidr,DIRECT
rules=MATCH,✅ Selector

; ─── گروه‌های پراکسی ───
custom_proxy_group=✅ Selector`select`[]♻️ Auto`.*`DIRECT
custom_proxy_group=♻️ Auto`url-test`.*`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
