;---------------------------------------------------------
; ACL4SSR Online Full - Customized with Iran Rules & AdBlock
;---------------------------------------------------------
[General]
loglevel = info
dns = system
tun = false
mixed-port = 7890

[custom]
; Rule Provider های پیش‌فرض ACL4SSR
ruleset=Reject,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Reject.yaml
ruleset=Proxy,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Proxy.yaml
ruleset=Direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Direct.yaml
ruleset=LAN,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/LAN.yaml
ruleset=Apple,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Apple.yaml
ruleset=Microsoft,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Microsoft.yaml
ruleset=Google,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Google.yaml
ruleset=Netflix,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Netflix.yaml
ruleset=Spotify,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Spotify.yaml
ruleset=YouTube,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/YouTube.yaml
ruleset=Telegram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Telegram.yaml
ruleset=Disney,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Disney.yaml
ruleset=PrimeVideo,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/PrimeVideo.yaml
ruleset=HBO,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/HBO.yaml
ruleset=GitHub,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/GitHub.yaml
ruleset=Steam,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Steam.yaml
ruleset=Speedtest,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Speedtest.yaml
ruleset=OneDrive,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/OneDrive.yaml
ruleset=PayPal,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/PayPal.yaml
ruleset=Adobe,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Adobe.yaml
ruleset=Discord,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Discord.yaml
ruleset=Twitter,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Twitter.yaml
ruleset=Facebook,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Facebook.yaml
ruleset=Instagram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Instagram.yaml
ruleset=Wikipedia,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/Wikipedia.yaml
ruleset=WhatsApp,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/WhatsApp.yaml
ruleset=OpenAI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/OpenAI.yaml

; ===== Rule Provider های جدید ایران، تبلیغات و بدافزار =====
ruleset=IranCIDR,https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ircidr.txt
ruleset=IranDomains,https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt
ruleset=AdBlock,https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/category-ads-all.txt
ruleset=MalwareDomains,https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware.txt
ruleset=MalwareIPs,https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware-ip.txt

[Rule]
; ===== مسدودسازی تبلیغات و بدافزار (اولویت اول) =====
RULE-SET,AdBlock,REJECT
RULE-SET,MalwareDomains,REJECT
RULE-SET,MalwareIPs,REJECT

; قوانین رد پیش‌فرض (حفظ شده از نسخه اصلی)
DOMAIN-KEYWORD,ad,REJECT
DOMAIN-KEYWORD,ads,REJECT
DOMAIN-KEYWORD,advert,REJECT
DOMAIN-KEYWORD,analytics,REJECT
DOMAIN-KEYWORD,telemetry,REJECT
DOMAIN-KEYWORD,sponsor,REJECT
DOMAIN-KEYWORD,tracker,REJECT
DOMAIN-SUFFIX,doubleclick.net,REJECT
DOMAIN-SUFFIX,googlesyndication.com,REJECT
DOMAIN-SUFFIX,googleadservices.com,REJECT
DOMAIN-SUFFIX,googletagmanager.com,REJECT
DOMAIN-SUFFIX,googletagservices.com,REJECT
DOMAIN-SUFFIX,scorecardresearch.com,REJECT
DOMAIN-SUFFIX,serving-sys.com,REJECT

; ===== ارتباطات محلی و LAN =====
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,240.0.0.0/4,DIRECT,no-resolve

; ===== ایران - مستقیم (قبل از قوانین پروکسی) =====
RULE-SET,IranCIDR,DIRECT
RULE-SET,IranDomains,DIRECT

; ===== قوانین سرویس‌های خاص =====
RULE-SET,Apple,DIRECT
RULE-SET,Microsoft,DIRECT
RULE-SET,Google,DIRECT
RULE-SET,Netflix,✅Select
RULE-SET,Spotify,✅Select
RULE-SET,YouTube,✅Select
RULE-SET,Telegram,✅Select
RULE-SET,Disney,✅Select
RULE-SET,PrimeVideo,✅Select
RULE-SET,HBO,✅Select
RULE-SET,GitHub,✅Select
RULE-SET,Steam,✅Select
RULE-SET,Speedtest,DIRECT
RULE-SET,OneDrive,DIRECT
RULE-SET,PayPal,DIRECT
RULE-SET,Adobe,DIRECT
RULE-SET,Discord,✅Select
RULE-SET,Twitter,✅Select
RULE-SET,Facebook,✅Select
RULE-SET,Instagram,✅Select
RULE-SET,Wikipedia,DIRECT
RULE-SET,WhatsApp,✅Select
RULE-SET,OpenAI,✅Select

; ===== قوانین GEOIP (CN=چین) =====
GEOIP,CN,DIRECT

; ===== تمام ترافیک باقی‌مانده از طریق گروه ✅Select =====
MATCH,✅Select
